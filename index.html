<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ほっこりマン10連ガチャ</title>

<style>
body {
  margin: 0;
  padding: 20px;
  background: #f3d889;
  font-family: sans-serif;
  text-align: center;
}

h1 {
  margin-bottom: 5px;
}

.rate {
  margin-bottom: 20px;
  font-weight: bold;
}

button {
  font-size: 22px;
  font-weight: bold;
  padding: 15px 35px;
  border: none;
  border-radius: 12px;
  background: #d62828;
  color: white;
  cursor: pointer;
  box-shadow: 0 5px 0 #8d1818;
}

button:active {
  transform: translateY(3px);
  box-shadow: 0 2px 0 #8d1818;
}

#gacha-result {
  max-width: 1000px;
  margin: 30px auto;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 12px;
}

.card {
  aspect-ratio: 1 / 1;
  background: white;
  border: 5px solid white;
  border-radius: 10px;
  box-sizing: border-box;

  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;

  padding: 8px;
  font-weight: bold;
}

.card-number {
  font-size: 14px;
  margin-bottom: 8px;
}

.card-name {
  font-size: 18px;
}

.C {
  background: #eeeeee;
}

.R {
  background: #ffe9a8;
  box-shadow:
    0 0 10px #ffd700,
    0 0 25px #fff3a0;
}

.SR {
  background: white;
  box-shadow:
    0 0 10px red,
    0 0 20px orange,
    0 0 30px yellow,
    0 0 40px lime,
    0 0 50px cyan,
    0 0 60px blue,
    0 0 70px violet;
}

.rarity {
  margin-top: 8px;
  font-size: 14px;
}

@media (max-width: 700px) {
  body {
    padding: 10px;
  }

  #gacha-result {
    gap: 5px;
  }

  .card {
    padding: 3px;
    border-width: 3px;
  }

  .card-number {
    font-size: 9px;
  }

  .card-name {
    font-size: 10px;
  }

  .rarity {
    font-size: 9px;
  }
}
</style>
</head>

<body>

<h1>ほっこりマン10連ガチャ</h1>

<div class="rate">
C 70％ ／ R 26％ ／ SR 4％
</div>

<button onclick="tenGacha()">
10連ガチャ！
</button>

<div id="gacha-result"></div>

<script>

const common = [
["C001","Mr.しも"],
["C002","北畠社長"],
["C003","進藤 歩"],
["C004","魚河岸 喜平次"],
["C005","金山 譲"],
["C006","チャック・ザ・クラッシャー"],
["C007","Mr.レモ"],
["C008","G（ジー）"],
["C009","コビー・グッドソン"],
["C010","シン"],
["C011","クライム"],
["C012","メカMr.しも"],
["C013","ロマン・オルロフ"],
["C014","ジュエル市ノ瀬"],
["C015","須王 一矢"],
["C016","橘 誠士郎"],
["C017","仙石・GB・秀兵衛"]
];

const rare = [
["R001","ザ・ミック"],
["R002","リー・イェフー"],
["R003","サザト"],
["R004","金定 雅"],
["R005","カツカレーライス"],
["R006","クリス・デプス"]
];

const superRare = [
["SR001","ジンノ・シンスケ"],
["SR002","ベン“S・A・D”ジョナー"],
["SR003","城戸真絃"],
["SR004","ダニエル・コステロ"]
];

function randomCharacter(list) {
  return list[Math.floor(Math.random() * list.length)];
}

function drawOne() {

  const r = Math.random() * 100;

  if (r < 70) {
    return {
      rarity: "C",
      data: randomCharacter(common)
    };
  }

  if (r < 96) {
    return {
      rarity: "R",
      data: randomCharacter(rare)
    };
  }

  return {
    rarity: "SR",
    data: randomCharacter(superRare)
  };
}

function tenGacha() {

  const result = document.getElementById("gacha-result");

  result.innerHTML = "";

  for (let i = 0; i < 10; i++) {

    const draw = drawOne();

    const card = document.createElement("div");

    card.className = "card " + draw.rarity;

    card.innerHTML = `
      <div class="card-number">
        ${i + 1}枚目
      </div>

      <div class="card-name">
        ${draw.data[0]}<br>
        ${draw.data[1]}
      </div>

      <div class="rarity">
        ${draw.rarity}
      </div>
    `;

    result.appendChild(card);
  }
}

</script>

</body>
</html>
