<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ほっこりマンガチャ</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:18px 10px 40px;text-align:center;font-family:sans-serif;
 min-height:100vh;color:#222;
 background:radial-gradient(circle at top,#fff0b0,#e4b94d 55%,#b98220)
}
h1{margin:8px 0;font-size:28px}
.rate{font-weight:bold;margin-bottom:12px}
#remain{font-size:19px;font-weight:bold;margin:14px}
button{
 border:0;border-radius:14px;padding:15px 38px;
 font-size:22px;font-weight:bold;color:#fff;background:#d62828;
 box-shadow:0 6px 0 #841919
}
button:disabled{background:#888;box-shadow:none}
#stage{
 width:min(92vw,520px);min-height:390px;margin:25px auto 5px;
 display:flex;flex-direction:column;align-items:center;justify-content:center
}
.pack{width:100%;max-height:400px;object-fit:contain;animation:pop .25s}
@keyframes pop{from{opacity:.2;transform:scale(.97)}to{opacity:1}}
.result{
 width:min(82vw,410px);aspect-ratio:1/1;border-radius:16px;
 animation:rise .7s cubic-bezier(.2,.9,.25,1.18)
}
.result img{width:100%;height:100%;object-fit:contain;border-radius:16px}
@keyframes rise{
 from{opacity:0;transform:translateY(170px) scale(.82)}
 70%{transform:translateY(-10px) scale(1.03)}
 to{opacity:1;transform:none}
}
.R{box-shadow:0 0 15px #fff,0 0 35px #ffd43b,0 0 60px #d99b00}
.SR{animation:rise .7s cubic-bezier(.2,.9,.25,1.18),rainbow 1.5s linear infinite}
@keyframes rainbow{
 0%{box-shadow:0 0 18px red,0 0 45px orange}
 25%{box-shadow:0 0 18px #ff0,0 0 45px lime}
 50%{box-shadow:0 0 18px cyan,0 0 45px blue}
 75%{box-shadow:0 0 18px violet,0 0 45px #f0c}
 100%{box-shadow:0 0 18px red,0 0 45px orange}
}
#name{font-size:22px;font-weight:bold;margin-top:16px}
#msg{font-size:19px;font-weight:bold;line-height:1.7;margin-top:18px}
</style>
</head>

<body>
<h1>ほっこりマンガチャ</h1>
<div class="rate">C 70％ ／ R 26％ ／ SR 4％</div>
<div id="remain"></div>
<button id="btn" onclick="gacha()">1枚引く！</button>
<div id="stage"></div>
<div id="name"></div>
<div id="msg"></div>

<script>
const C=[
["C001","Mr.しも"],["C002","北畠社長"],["C003","進藤 歩"],
["C004","魚河岸 喜平次"],["C005","金山 譲"],
["C006","チャック・ザ・クラッシャー"],["C007","Mr.レモ"],
["C008","G（ジー）"],["C009","コビー・グッドソン"],
["C010","シン"],["C011","クライム"],["C012","メカMr.しも"],
["C013","ロマン・オルロフ"],["C014","ジュエル市ノ瀬"],
["C015","須王 一矢"],["C016","橘 誠士郎"],
["C017","仙石・GB・秀兵衛"]
];

const R=[
["R001","ザ・ミック"],["R002","リー・イェフー"],
["R003","サザト"],["R004","金定 雅"],
["R005","カツカレーライス"],["R006","クリス・デプス"]
];

const SR=[
["SR001","ジンノ・シンスケ"],
["SR002","ベン“S・A・D”ジョナー"],
["SR003","城戸真絃"],["SR004","ダニエル・コステロ"]
];

const LIMIT=3,KEY="hokkoriman-gacha";
let playing=false;

function today(){return new Date().toLocaleDateString("ja-JP")}
function data(){
 let d;
 try{d=JSON.parse(localStorage.getItem(KEY))}catch(e){}
 if(!d||d.date!==today()){d={date:today(),count:0};save(d)}
 return d
}
function save(d){localStorage.setItem(KEY,JSON.stringify(d))}
function rand(a){return a[Math.floor(Math.random()*a.length)]}
function draw(){
 let n=Math.random()*100;
 if(n<70)return{rarity:"C",card:rand(C)};
 if(n<96)return{rarity:"R",card:rand(R)};
 return{rarity:"SR",card:rand(SR)}
}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}

function status(){
 let d=data(),left=Math.max(0,LIMIT-d.count);
 remain.textContent="本日のガチャ　あと"+left+"回";
 if(left===0){
  btn.disabled=true;
  msg.innerHTML="本日のガチャは終了しました<br>明日もご来場、心よりお待ちしております！"
 }
}

async function pack(file,ms){
 stage.innerHTML='<img class="pack" src="'+file+'">';
 await sleep(ms)
}

function cardImage(id,img){
 let ext=[".png",".jpg",".jpeg",".webp"],i=0;
 img.onerror=()=>{if(i<ext.length)img.src=id+ext[i++]};
 img.onerror()
}

function showResult(d){
 stage.innerHTML="";
 let box=document.createElement("div");
 box.className="result "+d.rarity;

 let img=document.createElement("img");
 img.alt=d.card[1];
 cardImage(d.card[0],img);

 box.appendChild(img);
 stage.appendChild(box);
 name.textContent=d.rarity+"　"+d.card[1]
}

async function gacha(){
 if(playing)return;
 let d=data();
 if(d.count>=LIMIT){status();return}

 playing=true;
 btn.disabled=true;
 msg.textContent="";
 name.textContent="";

 let result=draw();
 d.count++;
 save(d);
 remain.textContent="本日のガチャ　あと"+(LIMIT-d.count)+"回";

 await pack("袋1.jpg",750);
 await pack("袋2.jpg",800);
 await pack("袋3.jpg",950);

 stage.innerHTML="";
 await sleep(350);

 showResult(result);
 playing=false;

 if(d.count<LIMIT){
  btn.disabled=false
 }else{
  msg.innerHTML="本日のガチャは終了しました<br>明日もご来場、心よりお待ちしております！"
 }
}

status();
</script>
</body>
</html>
