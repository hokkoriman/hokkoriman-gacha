<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ほっこりマン ガチャ</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:18px 10px 40px;min-height:100vh;text-align:center;font-family:sans-serif;color:#222;background:radial-gradient(circle at top,#fff0b0,#e4b94d 55%,#b98220);overflow-x:hidden}
h1{margin:8px 0 10px;font-size:28px}
.greeting{font-size:18px;font-weight:bold;margin:0 0 10px}
.counts{font-size:16px;font-weight:bold;margin:0 0 8px}
#remain{font-size:18px;font-weight:bold;margin:10px 0 14px}
#btn{border:0;border-radius:14px;padding:15px 40px;font-size:22px;font-weight:bold;color:#fff;background:#d62828;box-shadow:0 6px 0 #841919}
#btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 #841919}
#btn:disabled{opacity:.58;box-shadow:none}
#stage{width:min(94vw,540px);height:470px;margin:20px auto 0;position:relative;display:flex;justify-content:center;align-items:center;overflow:visible}
.pack{width:100%;max-height:440px;object-fit:contain}
.pack-in{animation:packIn .28s ease-out}
.pack-hit{animation:packHit .35s ease-out}
.pack-out{animation:packOut .4s ease-in forwards}
@keyframes packIn{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:scale(1)}}
@keyframes packHit{0%{opacity:.25;transform:scale(.9)}55%{opacity:1;transform:scale(1.055)}100%{transform:scale(1)}}
@keyframes packOut{from{opacity:1;transform:translateY(0) scale(1)}to{opacity:0;transform:translateY(-55px) scale(.96)}}
.result{width:min(82vw,410px);aspect-ratio:1/1;position:relative;border-radius:18px}
.result img{width:100%;height:100%;object-fit:contain;display:block;border-radius:16px}
.card-enter{animation:cardEnter .95s cubic-bezier(.17,.89,.32,1.28)}
@keyframes cardEnter{0%{opacity:0;transform:translateY(430px) scale(.55) rotate(-4deg)}60%{opacity:1;transform:translateY(-28px) scale(1.06) rotate(1deg)}78%{transform:translateY(12px) scale(.98)}100%{transform:translateY(0) scale(1) rotate(0)}}
.R{animation:cardEnter .95s cubic-bezier(.17,.89,.32,1.28),goldGlow 1.2s ease-in-out .9s infinite alternate}
@keyframes goldGlow{from{filter:brightness(1);box-shadow:0 0 10px #fff,0 0 25px #ffd84d,0 0 45px #d99b00}to{filter:brightness(1.12);box-shadow:0 0 20px #fff,0 0 45px #ffe76c,0 0 80px #ffb700}}
.SR{animation:cardEnter .95s cubic-bezier(.17,.89,.32,1.28),rainbowGlow 1.35s linear .9s infinite}
@keyframes rainbowGlow{0%{box-shadow:0 0 20px red,0 0 50px orange}20%{box-shadow:0 0 20px orange,0 0 50px yellow}40%{box-shadow:0 0 20px yellow,0 0 50px lime}60%{box-shadow:0 0 20px cyan,0 0 50px blue}80%{box-shadow:0 0 20px blue,0 0 50px violet}100%{box-shadow:0 0 20px violet,0 0 50px red}}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:999}
.white-flash{animation:whiteFlash .48s ease-out}
@keyframes whiteFlash{0%{opacity:0}20%{opacity:.95}100%{opacity:0}}
#name{min-height:38px;margin-top:8px;font-size:23px;font-weight:bold}
#msg{min-height:52px;margin-top:8px;font-size:17px;font-weight:bold;line-height:1.7}
.end-title{font-size:20px}
.end-message{font-size:17px}
.blog-link{display:inline-block;margin-top:22px;padding:12px 20px;border:2px solid #7a5317;border-radius:12px;color:#5a390c;background:rgba(255,255,255,.55);font-size:16px;font-weight:bold;text-decoration:none}
.blog-link:active{transform:translateY(2px)}
@media(max-width:600px){#stage{height:390px}h1{font-size:25px}.greeting{font-size:16px}.counts{font-size:14px}#btn{font-size:21px}}

.HR{animation:hrCardEnter 1.2s cubic-bezier(.15,.95,.25,1.18),hrAura 1.1s ease-in-out 1s infinite alternate;filter:drop-shadow(0 0 8px #fff)}
@keyframes hrCardEnter{0%{opacity:0;transform:scale(.08) rotate(-15deg);filter:brightness(5) blur(6px)}35%{opacity:1;transform:scale(1.28) rotate(2deg);filter:brightness(2.4) blur(0)}68%{transform:scale(.93) rotate(-1deg)}100%{transform:scale(1) rotate(0);filter:brightness(1)}}
@keyframes hrAura{from{box-shadow:0 0 18px #fff,0 0 50px #ffe787,0 0 95px #d7a400,0 0 150px rgba(255,255,255,.35)}to{box-shadow:0 0 30px #fff,0 0 75px #fff3b8,0 0 135px #f4c430,0 0 210px rgba(255,255,255,.55)}}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:9999}.white-flash{animation:whiteFlash .48s ease-out}@keyframes whiteFlash{0%{opacity:0}20%{opacity:.95}100%{opacity:0}}
#hrOverlay{position:fixed;inset:0;pointer-events:none;z-index:5000;opacity:0;display:none;overflow:hidden;background:rgba(0,0,0,.98)}
#hrOverlay.active{display:block;animation:hrCurtain 2.8s ease forwards}@keyframes hrCurtain{0%{opacity:0}10%{opacity:1}58%{opacity:1}100%{opacity:0}}
#hrOverlay .rays{position:absolute;left:50%;top:50%;width:170vmax;height:170vmax;transform:translate(-50%,-50%);background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.0) 0deg 5deg,rgba(255,223,112,.45) 5deg 7deg,rgba(255,255,255,.0) 7deg 13deg);filter:blur(.3px);animation:raysSpin 2.6s cubic-bezier(.2,.8,.2,1) forwards;opacity:0}@keyframes raysSpin{0%{opacity:0;transform:translate(-50%,-50%) scale(.15) rotate(0)}28%{opacity:.25}52%{opacity:1;transform:translate(-50%,-50%) scale(.8) rotate(28deg)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.35) rotate(55deg)}}
#hrOverlay .core{position:absolute;left:50%;top:50%;width:12vmin;height:12vmin;border-radius:50%;transform:translate(-50%,-50%);background:#fff;box-shadow:0 0 35px 15px #fff,0 0 100px 55px #ffdf69,0 0 220px 120px rgba(255,215,80,.75);animation:coreBurst 2.5s ease-out forwards}@keyframes coreBurst{0%,18%{opacity:0;transform:translate(-50%,-50%) scale(.1)}36%{opacity:1;transform:translate(-50%,-50%) scale(.5)}58%{opacity:1;transform:translate(-50%,-50%) scale(6)}100%{opacity:0;transform:translate(-50%,-50%) scale(11)}}
#hrOverlay .hr-title{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.5);font-size:clamp(32px,8vw,82px);font-weight:1000;letter-spacing:.11em;color:#fff8cf;text-shadow:0 0 8px #fff,0 0 20px #ffe16b,0 0 45px #c58d00,3px 3px 0 #000;white-space:nowrap;opacity:0;animation:hrTitle 2.45s ease forwards}@keyframes hrTitle{0%,34%{opacity:0;transform:translate(-50%,-50%) scale(.35)}48%{opacity:1;transform:translate(-50%,-50%) scale(1.18)}65%{opacity:1;transform:translate(-50%,-50%) scale(1)}82%,100%{opacity:0;transform:translate(-50%,-50%) scale(1.35)}}
.spark{position:absolute;width:7px;height:7px;border-radius:50%;background:#fff4ad;box-shadow:0 0 12px #fff,0 0 24px #ffd64d;animation:sparkFly 1.7s ease-out forwards}@keyframes sparkFly{0%{opacity:0;transform:translate(0,0) scale(.2)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.8)}}

</style>
</head>
<body>
<h1>ほっこりマン ガチャ</h1>
<div class="greeting">本日もご来場、まことにありがとうございます！</div>
<div id="counts" class="counts"></div>
<div id="remain"></div>
<button id="btn" onclick="gacha()">1枚引く！</button>
<div id="stage"></div>
<div id="name"></div>
<div id="msg"></div>
<div id="flash"></div>
<div id="hrOverlay"><div class="rays"></div><div class="core"></div><div class="hr-title">HOKKORI RARE</div></div>
<a class="blog-link" href="https://ameblo.jp/mister-shimo">「Mr.しものまだまだ前途遼遠」へ</a>

<script>
const C=[["C001","Mr.しも"],["C002","北畠社長"],["C003","進藤 歩"],["C004","魚河岸 喜平次"],["C005","金山 譲"],["C006","チャック・ザ・クラッシャー"],["C007","Mr.レモ"],["C008","G（ジー）"],["C009","コビー・グッドソン"],["C010","シン"],["C011","クライム"],["C012","メカMr.しも"],["C013","ロマン・オルロフ"],["C014","ジュエル市ノ瀬"],["C015","須王 一矢"],["C016","橘 誠士郎"],["C017","仙石・GB・秀兵衛"]];
const R=[["R001","ザ・ミック"],["R002","リー・イェフー"],["R003","サザト"],["R004","金定 雅"],["R005","カツカレーライス"],["R006","クリス・デプス"]];
const SR=[["SR001","ジンノ・シンスケ"],["SR002","ベン“S・A・D”ジョナー"],["SR003","城戸真絃"],["SR004","ダニエル・コステロ"]];
const HR=[["HR001","HR001"]];

const LIMIT=3;
const STORAGE_KEY="hokkoriman_daily_gacha_final_v1";
const COLLECTION_KEY="hokkoriman_collection_v1";
let playing=false;

function getCollection(){
  try{
    const x=JSON.parse(localStorage.getItem(COLLECTION_KEY));
    return Array.isArray(x)?x:[];
  }catch(e){return []}
}
function saveCollection(x){localStorage.setItem(COLLECTION_KEY,JSON.stringify(x))}
function registerCard(id){
  const x=getCollection();
  if(!x.includes(id)){x.push(id);saveCollection(x)}
  updateCounts();
}
function ownedCount(prefix){return getCollection().filter(id=>id.startsWith(prefix)).length}
function updateCounts(){
  counts.textContent=
    `C（コモン） ${ownedCount("C")}種 / 全${C.length}種 ／ `+
    `R（レア） ${ownedCount("R")}種 / 全${R.length}種 ／ `+
    `SR（スーパーレア） ${ownedCount("SR")}種 / 全${SR.length}種 ／ `+
    `HR（ほっこりレア） ${ownedCount("HR")}種 / 全？種`;
}
updateCounts();

function today(){
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function saveDaily(d){localStorage.setItem(STORAGE_KEY,JSON.stringify(d))}
function daily(){
  let d;
  try{d=JSON.parse(localStorage.getItem(STORAGE_KEY))}catch(e){}
  if(!d||d.date!==today()){d={date:today(),count:0};saveDaily(d)}
  return d;
}
function updateStatus(){
  const d=daily();
  const left=Math.max(0,LIMIT-d.count);
  remain.textContent=`本日のガチャ　あと${left}回`;
  if(left===0){
    btn.disabled=true;
    msg.innerHTML='<div class="end-title">本日のガチャは終了しました</div><div class="end-message">明日もご来場、心よりお待ちしております！</div>';
  }else if(!playing){
    btn.disabled=false;
  }
}
function rand(list){return list[Math.floor(Math.random()*list.length)]}
function draw(){
  const n=Math.random()*100;
  if(n<68.5)return{rarity:"C",card:rand(C)};
  if(n<93.5)return{rarity:"R",card:rand(R)};
  if(n<99.5)return{rarity:"SR",card:rand(SR)};
  return{rarity:"HR",card:rand(HR)};
}
function sleep(ms){return new Promise(resolve=>setTimeout(resolve,ms))}
async function showPack(file,time,type){
  stage.innerHTML="";
  const img=document.createElement("img");
  img.src=file;
  img.className="pack "+type;
  stage.appendChild(img);
  await sleep(time);
}
function whiteFlash(){
  flash.className="";
  void flash.offsetWidth;
  flash.className="white-flash";
}
function spawnSparks(){const overlay=document.getElementById('hrOverlay');overlay.querySelectorAll('.spark').forEach(e=>e.remove());const cx=window.innerWidth/2,cy=window.innerHeight/2;for(let i=0;i<70;i++){const s=document.createElement('div');s.className='spark';s.style.left=cx+'px';s.style.top=cy+'px';const a=Math.random()*Math.PI*2;const d=120+Math.random()*Math.max(window.innerWidth,window.innerHeight)*.7;s.style.setProperty('--dx',Math.cos(a)*d+'px');s.style.setProperty('--dy',Math.sin(a)*d+'px');s.style.animationDelay=(Math.random()*.4)+'s';overlay.appendChild(s)}}

async function hrReveal(result,img){const overlay=document.getElementById('hrOverlay');overlay.className='';void overlay.offsetWidth;spawnSparks();overlay.className='active';await sleep(1050);whiteFlash();await sleep(520);showResult(result,img);await sleep(1500);overlay.className=''}

function preloadCard(id){
  return new Promise(resolve=>{
    const ext=[".png",".jpg",".jpeg",".webp",".PNG",".JPG",".JPEG",".WEBP"];
    let i=0;
    const img=new Image();
    function next(){
      if(i>=ext.length){resolve(null);return}
      img.src=id+ext[i++];
    }
    img.onload=()=>resolve(img);
    img.onerror=next;
    next();
  });
}
function showResult(result,img){
  stage.innerHTML="";
  const box=document.createElement("div");
  box.className="result card-enter";
  if(result.rarity==="R")box.className="result R";
  if(result.rarity==="SR"){whiteFlash();box.className="result SR"}
  if(result.rarity==="HR")box.className="result HR"
  if(img){img.alt=result.card[1];box.appendChild(img)}
  stage.appendChild(box);
  name.textContent=result.rarity+"　"+result.card[1];
}
async function gacha(){
  if(playing)return;
  const d=daily();
  if(d.count>=LIMIT){updateStatus();return}

  playing=true;
  btn.disabled=true;
  name.textContent="";
  msg.textContent="";

  const result=draw();
  const imagePromise=preloadCard(result.card[0]);

  d.count++;
  saveDaily(d);
  remain.textContent=`本日のガチャ　あと${Math.max(0,LIMIT-d.count)}回`;

  await showPack("袋1.jpg",1200,"pack-in");
  await showPack("袋2.png",1000,"pack-hit");
  await showPack("袋3.png",1200,"pack-hit");

  const lastPack=stage.querySelector("img");
  if(lastPack)lastPack.className="pack pack-out";

  await sleep(450);
  stage.innerHTML="";
  await sleep(600);

  const loadedImage=await imagePromise;
  if(result.rarity==="HR" && loadedImage){
    await hrReveal(result,loadedImage);
  }else{
    showResult(result,loadedImage);
  }
  registerCard(result.card[0]);

  await sleep(1000);
  playing=false;

  if(d.count>=LIMIT){
    btn.disabled=true;
    msg.innerHTML='<div class="end-title">本日のガチャは終了しました</div><div class="end-message">明日もご来場、心よりお待ちしております！</div>';
  }else{
    btn.disabled=false;
    msg.textContent="もう一枚引く？";
  }
}
updateStatus();
</script>
</body>
</html>
