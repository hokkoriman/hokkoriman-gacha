<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ほっこりマンガチャ</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:18px 10px 40px;
  min-height:100vh;
  text-align:center;
  font-family:sans-serif;
  color:#222;
  background:radial-gradient(circle at top,#fff0b0,#e4b94d 55%,#b98220);
  overflow-x:hidden;
}

h1{
  margin:8px 0;
  font-size:28px;
}

.rate{
  font-weight:bold;
  margin-bottom:15px;
}

#btn{
  border:0;
  border-radius:14px;
  padding:15px 40px;
  font-size:22px;
  font-weight:bold;
  color:white;
  background:#d62828;
  box-shadow:0 6px 0 #841919;
}

#btn:active:not(:disabled){
  transform:translateY(4px);
  box-shadow:0 2px 0 #841919;
}

#btn:disabled{
  opacity:.65;
}

#stage{
  width:min(94vw,540px);
  height:470px;
  margin:20px auto 0;
  position:relative;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:visible;
}

.pack{
  width:100%;
  max-height:440px;
  object-fit:contain;
}

.pack-in{
  animation:packIn .28s ease-out;
}

@keyframes packIn{
  from{
    opacity:0;
    transform:scale(.88);
  }
  to{
    opacity:1;
    transform:scale(1);
  }
}

.pack-hit{
  animation:packHit .35s ease-out;
}

@keyframes packHit{
  0%{
    opacity:.25;
    transform:scale(.9);
  }
  55%{
    opacity:1;
    transform:scale(1.055);
  }
  100%{
    transform:scale(1);
  }
}

.pack-out{
  animation:packOut .4s ease-in forwards;
}

@keyframes packOut{
  from{
    opacity:1;
    transform:translateY(0) scale(1);
  }
  to{
    opacity:0;
    transform:translateY(-55px) scale(.96);
  }
}

.result{
  width:min(82vw,410px);
  aspect-ratio:1/1;
  position:relative;
  border-radius:18px;
}

.result img{
  width:100%;
