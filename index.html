<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ほっこりマンガチャ</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px 12px 40px;
  background:
    radial-gradient(circle at top, #fff0b0 0%, #e6bd55 45%, #b78325 100%);
  font-family: sans-serif;
  text-align: center;
  min-height: 100vh;
  color: #222;
}

h1 {
  margin: 8px 0 6px;
  font-size: 30px;
}

.rate {
  font-weight: bold;
  margin-bottom: 12px;
}

.remaining {
  font-size: 20px;
  font-weight: bold;
  margin: 12px 0 18px;
}

#gacha-button {
  font-size: 24px;
  font-weight: bold;
  padding: 16px 42px;
  border: 0;
  border-radius: 14px;
  background: #d62828;
  color: white;
  box-shadow: 0 6px 0 #821717;
  cursor: pointer;
}

#gacha-button:active:not(:disabled) {
  transform: translateY(4px);
  box-shadow: 0 2px 0 #821717;
}

#gacha-button:disabled {
  background: #888;
  box-shadow: none;
  cursor: default;
}

#stage {
  width: min(92vw, 520px);
  min-height: 440px;
  margin: 28px auto 10px;
  display: flex;
  justify-content: center;
  align-items: center;
  position: relative;
}

.pack-image {
  width: 100%;
  max-height: 430px;
  object-fit: contain;
  display: block;
}

.flash {
  animation: flashCut 0.18s ease;
}

@keyframes flashCut {
  0%   { opacity: 0.2; transform: scale(0.98); }
  100% { opacity: 1; transform: scale(1); }
}

.result-wrap {
  width: min(82vw, 410px);
  aspect-ratio: 1 / 1;
  position: relative;
  border-radius: 18px;
}

.result-card {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
  border-radius: 16px;
}

.slide-in {
  animation: cardRise 0.72s cubic-bezier(.2,.9,.25,1.18);
}

@keyframes cardRise {
  0% {
    opacity: 0;
    transform: translateY(180px) scale(0.82);
  }
  70% {
    opacity: 1;
    transform: translateY(-12px) scale(1.03);
  }
  100% {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

.r-glow {
  box-shadow:
    0 0 14px #fff6be
